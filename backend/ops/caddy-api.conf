api.neurocrop.lt {
    reverse_proxy neurocrop-api:3000 {
        # Retry safe reads while the upstream reconnects during a deployment.
        # Requests that change data are never replayed after a connection error.
        lb_try_duration 5s
        lb_try_interval 250ms
        lb_retry_match {
            method GET HEAD OPTIONS
        }
        transport http {
            # Expire pooled connections before Node's default five-second idle timeout.
            keepalive 4s
        }
    }
}
