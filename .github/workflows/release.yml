name: Build and deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful CI for this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs="$(gh api \
            --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${GITHUB_SHA}" \
            -f status=success \
            -f per_page=1 \
            --jq '.total_count')"
          if test "$successful_runs" -lt 1; then
            echo "::error::Revision ${GITHUB_SHA} has no successful full CI run."
            exit 1
          fi

  image:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.image.outputs.backend }}
      frontend_image: ${{ steps.image.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: |
          echo "backend=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/neurocrop-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/neurocrop-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.image.outputs.backend }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.frontend }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.VPS_SSH_PRIVATE_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H '${{ secrets.VPS_HOST }}' >> ~/.ssh/known_hosts
      - name: Deploy immutable image
        run: ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "${{ inputs.environment }}:${GITHUB_SHA}"
