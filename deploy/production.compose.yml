services:
  neurocrop-api:
    image: ${NEUROCROP_BACKEND_IMAGE:?Set NEUROCROP_BACKEND_IMAGE}
    container_name: neurocrop-api
    restart: unless-stopped
    networks:
      - chirpstack
    environment:
      NODE_ENV: production
      API_PORT: 3000
      TRUST_PROXY_HOPS: "1"
      PGHOST: postgresql
      PGUSER: ${PGUSER:-chirpstack}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD}
      PGDATABASE: ${PGDATABASE:-neurocrop}
      MEASUREMENT_RETENTION_DAYS: ${MEASUREMENT_RETENTION_DAYS:-35}
      CORS_ALLOWED_ORIGINS: https://neurocrop.lt,https://www.neurocrop.lt
      CLERK_SECRET_KEY_FILE: /run/secrets/clerk_secret_key
      CLERK_AUTHORIZED_PARTIES: https://neurocrop.lt,https://www.neurocrop.lt
      VAPID_PUBLIC_KEY_FILE: /run/secrets/vapid_public_key
      VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid_private_key
      VAPID_SUBJECT: mailto:alerts@neurocrop.lt
    secrets:
      - chirpstack_api_token
      - chirpstack_application_id
      - chirpstack_device_profile_id
      - default_otaa_app_key
      - resend_api_key
      - clerk_secret_key
      - vapid_public_key
      - vapid_private_key
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  neurocrop-ingest:
    image: ${NEUROCROP_BACKEND_IMAGE:?Set NEUROCROP_BACKEND_IMAGE}
    container_name: neurocrop-ingest
    restart: unless-stopped
    command: ["node", "ingest.js"]
    networks:
      - chirpstack
    environment:
      NODE_ENV: production
      PGHOST: postgresql
      PGUSER: ${PGUSER:-chirpstack}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD}
      PGDATABASE: ${PGDATABASE:-neurocrop}
      MQTT_URL: ${MQTT_URL:-mqtt://mosquitto:1883}
    healthcheck:
      test: ["CMD", "node", "ingest-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  chirpstack:
    external: true
    name: chirpstack_default

secrets:
  chirpstack_api_token:
    file: /opt/neurocrop-backend/.chirpstack_api_token
  chirpstack_application_id:
    file: /opt/neurocrop-backend/.chirpstack_application_id
  chirpstack_device_profile_id:
    file: /opt/neurocrop-backend/.chirpstack_device_profile_id
  default_otaa_app_key:
    file: /opt/neurocrop-backend/.default_otaa_app_key
  resend_api_key:
    file: /opt/neurocrop-backend/.resend_api_key
  clerk_secret_key:
    file: /opt/neurocrop-backend/.clerk_secret_key
  vapid_public_key:
    file: /opt/neurocrop-backend/.vapid_public_key
  vapid_private_key:
    file: /opt/neurocrop-backend/.vapid_private_key
